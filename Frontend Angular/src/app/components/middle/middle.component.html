<div 
  class="absolute top-0 left-0 w-full h-full bg-nexus-darkest z-20 pointer-events-none"
  [style.opacity]="overlayOpacity">
</div>

<section class="w-full bg-nexus-dark text-white py-16 px-8 relative overflow-hidden z-10">

  <div class="absolute top-8 left-0 z-0">
    <img src="assets/images/line-dark.svg" alt="" class="w-24 md:w-40">
    <img src="assets/images/line-light.svg" alt="" class="w-24 md:w-32 mt-2">
  </div>
  <img src="assets/images/post-it.svg" alt="" class="absolute bottom-0 right-0 z-0 w-24 md:w-24">

  <div class="container mx-auto flex flex-col md:flex-row items-center justify-center gap-10 z-10 relative">

    <h2 class="font-baseet text-2xl text-nexus-pink-light font-bold text-center md:text-right leading-tight">
      CAMADAS DO<br>PROJETO:
    </h2>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-x-6 gap-y-4">

      <div class="flex flex-col items-center text-center">
        <img src="assets/images/icon-database.svg" alt="Banco de Dados" class="w-24 h-24">
        <span class="mt-3 font-inter font-regular text-sm text-nexus-white">Banco de Dados</span>
      </div>

      <div class="flex flex-col items-center text-center">
        <img src="assets/images/icon-backend.svg" alt="Backend" class="w-24 h-24">
        <span class="mt-3 font-inter font-regular text-sm text-nexus-white">Backend</span>
      </div>

      <div class="flex flex-col items-center text-center">
        <img src="assets/images/icon-frontend.svg" alt="Frontend" class="w-24 h-24">
        <span class="mt-3 font-inter font-regular text-sm text-nexus-white">Frontend</span>
      </div>

      <div class="flex flex-col items-center text-center">
        <img src="assets/images/icon-rede.svg" alt="Redes" class="w-24 h-24">
        <span class="mt-3 font-inter font-regular text-sm text-nexus-white">Redes</span>
      </div>

    </div>
  </div>
</section>
