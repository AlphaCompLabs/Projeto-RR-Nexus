# =====================================================================================

<section id="login-form-section" class="w-full bg-login-gradient py-24 px-8 relative overflow-hidden">

  <img src="assets/images/network.svg" alt="" class="absolute top-8 left-0 w-1/3 md:w-1/4 z-0 opacity-20">
  <img src="assets/images/network.svg" alt="" class="absolute bottom-8 right-0 w-1/3 md:w-1/4 z-0 opacity-20 flip-horizontal">

  <div class="text-center z-10 relative">
    <h2 class="font-baseet text-xl text-nexus-pink-light font-semibold inline-block px-4 py-2 bg-nexus-purple-deep bg-opacity-20">
      FAÇA LOGIN PARA PARTICIPAR DESSA EXPERIÊNCIA!
    </h2>
  </div>

  <form (ngSubmit)="onLogin()" class="relative z-10 rounded-2xl max-w-lg mx-auto mt-10 shadow-2xl overflow-hidden">
      
    <div class="relative bg-nexus-pink-light bg-opacity-50 px-6 p-2 flex justify-between items-center z-10">
      <h3 class="font-baseet text-2xl text-white font-semibold pt-1">LOGIN</h3>
      
      <img src="assets/images/perfil-light.svg" alt="" class="w-7 h-7">
    </div>

    <div class="relative z-10 bg-nexus-purple-deep bg-opacity-50 p-8 md:p-10">

      <img src="assets/images/middle-circle-dark.svg" alt="" class="absolute left-0 top-1/5 z-0 w-32 opacity-60">
      <img src="assets/images/middle-circle-dark.svg" alt="" class="absolute right-0 top-1/5 z-0 w-32 opacity-60 flip-horizontal">
      
      <div class="relative z-10">
        <div class="mt-0">
          <label for="username" class="font-inter text-sm text-nexus-pink-light">Nome de Usuário:</label>
          <input 
            type="text" 
            id="username" 
            name="username"
            [(ngModel)]="username"
            (keydown.enter)="focusPassword($event)" class="w-full bg-nexus-cream rounded-md p-2 mt-2 text-nexus-darkest font-regular focus:outline-none focus:ring-2 focus:ring-nexus-lavender"
            required>
        </div>

        <div class="mt-4">
          <label for="password" class="font-inter text-sm text-nexus-pink-light">Senha:</label>
          <div class="relative">
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            id="password" 
            name="password"
            [(ngModel)]="password"
            #passwordInput class="w-full bg-nexus-cream rounded-md p-2 mt-2 text-nexus-darkest font-regular focus:outline-none focus:ring-2 focus:ring-nexus-lavender"
            required>
            <img 
              (click)="togglePasswordVisibility()"
              [src]="showPassword ? 'assets/images/olho-fechado.svg' : 'assets/images/olho.svg'"
              alt="Mostrar/Ocultar senha" 
              class="absolute right-4 top-1/2 -translate-y-[40%] w-6 cursor-pointer">
          </div>
        </div>

        <div class="mt-6 flex flex-col items-center">
          <a (click)="openForgotPassword($event)" href="#" class="font-inter text-sm text-nexus-lavender hover:text-nexus-magenta cursor-pointer">Esqueci minha senha.</a>
          <a href="#" class="font-inter text-sm text-nexus-lavender hover:text-nexus-magenta mt-1">Não possui cadastro? Cadastre-se aqui.</a>

          <button type="submit" class="w-full md:w-auto bg-nexus-purple text-white font-baseet font-semibold py-3 px-10 rounded-lg mt-6 hover:bg-nexus-magenta transition-colors duration-300">
            ENTRAR
          </button>
        </div>
      </div>
    </div>
  </form>

  <!--Recuperar Senha-->

  <div *ngIf="showForgotPassword" class="absolute inset-0 z-30 flex items-center justify-center p-4">
  
  <div (click)="closeForgotPassword()" class="absolute inset-0 bg-nexus-darkest bg-opacity-90"></div>

  <div class="relative z-40 w-full max-w-md overflow-hidden rounded-2xl shadow-2xl" (click)="$event.stopPropagation()">
    
  <div class="relative bg-nexus-purple-light p-4 flex justify-between items-center">
      
      <h3 class="font-baseet text-xl text-nexus-purple-deep font-semibold h-7 flex items-center pt-1">RECUPERAR SENHA</h3>
      
<div class="flex items-center gap-x-2">
        
        <img 
          src="assets/images/perfil-dark.svg" 
          alt="Ícone de perfil" 
          class="w-6 h-6">

        <button 
          type="button"
          (click)="closeForgotPassword()" 
          class="w-7 h-7 flex items-center justify-center rounded-md text-nexus-darkest bg-black bg-opacity-10 hover:bg-opacity-20 transition-all"
          aria-label="Fechar pop-up">
          
          <img 
            src="assets/images/exit-2.svg" 
            alt="Fechar" 
            class="w-4 h-4">

        </button>
      </div>

    </div>
    <div class="relative bg-nexus-pink-light p-8">
      
      <img src="assets/images/middle-circle-light.svg" alt="" class="absolute left-0 top-1/2 -translate-y-1/2 z-0 w-24 opacity-50">
      <img src="assets/images/middle-circle-light.svg" alt="" class="absolute right-0 top-1/5 -translate-y-1/2 z-0 w-24 opacity-50 flip-horizontal">

      <div class="relative z-10">

        <div *ngIf="forgotPasswordStep === 1">
          <label for="forgotUser" class="font-inter text-sm text-nexus-purple-deep">Digite o nome de usuário:</label>
          <input 
            type="text" 
            id="forgotUser" 
            name="forgotUser"
            [(ngModel)]="forgotUsername"
            (keydown.enter)="onFindPasswordEnter($event, forgotPasswordButton)" 
            class="w-full bg-nexus-cream rounded-md p-3 mt-2 text-nexus-darkest font-regular focus:outline-none focus:ring-2 focus:ring-nexus-magenta"
            required>
          
          <p *ngIf="showPasswordMessage" class="font-inter text-sm text-red-700 mt-2">{{ showPasswordMessage }}</p>

          <div class="flex justify-end mt-6">
            <button #forgotPasswordButton (click)="onFindPassword()" class="bg-nexus-purple text-white font-baseet font-semibold py-2 px-6 rounded-lg hover:bg-nexus-purple-deep transition-colors">
              PRÓXIMO
            </button>
          </div>
        </div>

        <div *ngIf="forgotPasswordStep === 2">
          <p class="font-inter text-sm text-nexus-purple-deep text-center">
            A senha do usuário <strong class="font-semibold">{{ foundUsernameDisplay }}</strong> é:
          </p>
          <p class="font-inter text-lg text-nexus-purple-deep font-bold text-center my-4 p-2 bg-nexus-cream rounded-md">
            {{ foundPassword }}
          </p>
          
          <div class="flex justify-end mt-6">
            <button (click)="onConclude()" class="bg-nexus-purple text-white font-baseet font-semibold py-2 px-6 rounded-lg hover:bg-nexus-purple-deep transition-colors">
              CONCLUÍDO
            </button>
          </div>
        </div>

      </div> </div> </div> </div> ```
</section>
